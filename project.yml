name: ReelsStudio
options:
  bundleIdPrefix: com.steliyanh
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Was NO. Three "function call causes an infinite recursion" warnings sat
    # unread across three releases while the pickers they described would have
    # overflowed the stack on use (#96). A warning nobody has to act on is a
    # warning nobody acts on.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  Kadr:
    url: https://github.com/SteliyanH/kadr.git
    minorVersion: 0.17.0
  KadrUI:
    url: https://github.com/SteliyanH/kadr-ui.git
    minorVersion: 0.16.0
  KadrCaptions:
    url: https://github.com/SteliyanH/kadr-captions.git
    minorVersion: 0.10.0
  KadrPhotos:
    url: https://github.com/SteliyanH/kadr-photos.git
    minorVersion: 0.9.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.36.0
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    # `from:` is .upToNextMajor and SwiftPM does not special-case 0.x, so the
    # previous `from: 0.9.11` accepted every future 0.x release including
    # breaking ones — and had already drifted to 0.10.3 on its own. The
    # .xcodeproj is gitignored, so there is no lockfile to catch that: this
    # pin is the only thing holding the version steady across machines and CI.
    minorVersion: 0.10.3
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.4

targets:
  ReelsStudio:
    type: application
    platform: iOS
    sources:
      # Globs the whole tree; .ttf files under Resources/Fonts are inferred as
      # resources and land flat at the .app root, same as en.lproj's strings.
      - path: Sources/ReelsStudio
    info:
      path: Sources/ReelsStudio/Info.plist
      properties:
        UILaunchScreen: {}
        # Archivo 400/600/800. Copy Bundle Resources flattens, so these are
        # bundle-root relative — no Fonts/ prefix.
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-SemiBold.ttf
          - Archivo-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Reels Studio reads your photos and videos so you can import them as clips."
        CFBundleDisplayName: Reels Studio
        # Bump both on every release. These had read 0.1.0 / 1 since the
        # XcodeGen switch, through ten releases, so `CrashReporter` tagged
        # every Sentry event `reels-studio@0.1.0+1` and no crash could be
        # attributed to the version it came from.
        CFBundleShortVersionString: "0.11.0"
        CFBundleVersion: "11"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steliyanh.reels-studio
        PRODUCT_NAME: ReelsStudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Kadr
      - package: KadrUI
      - package: KadrCaptions
      - package: KadrPhotos
      - package: Sentry
        product: Sentry

  ReelsStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReelsStudioTests
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ReelsStudio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ReelsStudio
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ReelsStudio
      - package: ViewInspector
      - package: SnapshotTesting
        product: SnapshotTesting

  ReelsStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ReelsStudioUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReelsStudio
    dependencies:
      - target: ReelsStudio

schemes:
  ReelsStudio:
    build:
      targets:
        ReelsStudio: all
        ReelsStudioTests: [test]
        ReelsStudioUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReelsStudioTests
        - ReelsStudioUITests
    archive:
      config: Release
