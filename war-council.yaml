# war-council.yaml — The Founding of this Necropolis
# Generated by the War Council. Edit freely; this file is law.
version: 1

lanes:
  - name: app
    path: "."
    ecosystem: ios
    gates:
      # No swiftlint config and no swiftlint binary on this machine.
      # The build gate below surfaces compiler warnings; that is the only
      # static signal available until a linter is adopted.
      # analyze: "swiftlint --strict"
      pre: "xcodegen generate"
      tests: >-
        xcodebuild test -project ReelsStudio.xcodeproj -scheme ReelsStudio
        -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
        CODE_SIGNING_ALLOWED=NO
      # `-only-testing:` takes a CLASS name, not a file name. The class in
      # AccessibilityWiringTests.swift is `ProjectRowAccessibilityTests`;
      # targeting the filename ran 0 tests and still reported TEST SUCCEEDED —
      # a permanently green gate that checked nothing. Verify any change here
      # by confirming the run reports a non-zero executed-test count.
      #
      # Every `-only-testing:` argument names a CLASS. Adding a class here is
      # the only way it is ever judged by this gate: the filter is exclusive,
      # so any a11y test class NOT listed is silently skipped even when it
      # exists and passes under the full `tests` gate.
      #
      # TransportAccessibilityTests added 2026-08-18 (#73 / PR #84): the gate
      # ran only ProjectRowAccessibilityTests and was therefore blind to the
      # entire transport band while still reporting green.
      a11y: >-
        xcodebuild test -project ReelsStudio.xcodeproj -scheme ReelsStudio
        -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
        -only-testing:ReelsStudioTests/ProjectRowAccessibilityTests
        -only-testing:ReelsStudioTests/TransportAccessibilityTests
        CODE_SIGNING_ALLOWED=NO
      build: >-
        xcodebuild build -project ReelsStudio.xcodeproj -scheme ReelsStudio
        -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
        CODE_SIGNING_ALLOWED=NO
      # release_build: "bundle exec fastlane build_release"   # unverified; fastlane/ exists

spawn_policy:
  max_squads: 4
  escalation_reserve: 1
  confirm_before_raising: true

models:
  review:
    provider: codex
    command: "codex exec --sandbox read-only"
    fallback: claude

conventions:
  - "Xcode project is GENERATED. Never hand-edit ReelsStudio.xcodeproj — edit project.yml, then run `xcodegen generate`."
  - "Info.plist is GENERATED from project.yml `info.properties`. Plist edits (e.g. UIAppFonts) go in project.yml or they are overwritten."
  - "Target sources glob `Sources/ReelsStudio` — new directories are picked up, but `xcodegen generate` must run before the project sees new files."
  - "iOS 17 floor. State is Swift Observation (@Observable), not ObservableObject. Do not reintroduce ObservableObject."
  - "ProjectDocument is schema v5. No schema changes, no new Project fields, no migrations without an explicit schema mission."
  - "All user-facing copy goes through Resources/en.lproj/Localizable.strings. New strings need keys; LocalizationTests enforces the bundle."
  - "View tests use ViewInspector for body smoke tests — keep view bodies inspectable (no opaque wrappers around asserted subviews)."
  - "DESIGN.md is the authority on scope per version. Features not in the current version are deferred deliberately — do not implement them."
